[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetlens"
version = "1.0.0"
description = "Vehicle fuel-economy data service: validated ETL, REST API, fleet emissions estimator and MPG prediction, with tests, CI/CD and observability."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sepideh Farivar" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
fleetlens = "fleetlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "unit: fast, isolated tests of pure functions",
  "integration: tests that touch the database or model artifacts",
  "e2e: full HTTP request/response tests through the API",
]

[tool.coverage.run]
source = ["fleetlens"]
omit = ["*/cli.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
