name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -m unit
      - name: Integration + end-to-end tests with coverage gate
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  typescript-client:
    name: TypeScript client build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [python, typescript-client]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fleetlens:${{ github.sha }} .
      - name: Smoke test the running container
        run: |
          docker run -d --name api -p 8000:8000 fleetlens:${{ github.sha }}
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          python3 scripts/smoke_test.py http://localhost:8000
      - if: failure()
        run: docker logs api
